<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00d4aa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00d4aa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Steam -->
  <path d="M35 25 Q38 15 35 5" stroke="url(#steamGrad)" stroke-width="2.5" fill="none" stroke-linecap="round">
    <animate attributeName="d" values="M35 25 Q38 15 35 5;M35 25 Q32 15 35 5;M35 25 Q38 15 35 5" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M50 22 Q53 12 50 2" stroke="url(#steamGrad)" stroke-width="2.5" fill="none" stroke-linecap="round">
    <animate attributeName="d" values="M50 22 Q53 12 50 2;M50 22 Q47 12 50 2;M50 22 Q53 12 50 2" dur="2.5s" repeatCount="indefinite"/>
  </path>
  <path d="M65 25 Q68 15 65 5" stroke="url(#steamGrad)" stroke-width="2.5" fill="none" stroke-linecap="round">
    <animate attributeName="d" values="M65 25 Q68 15 65 5;M65 25 Q62 15 65 5;M65 25 Q68 15 65 5" dur="3.5s" repeatCount="indefinite"/>
  </path>
  <!-- Cup body -->
  <rect x="25" y="35" width="50" height="40" rx="6" fill="url(#cupGrad)" opacity="0.9"/>
  <!-- Cup handle -->
  <path d="M75 42 Q90 42 90 55 Q90 68 75 68" stroke="url(#cupGrad)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9"/>
  <!-- Coffee surface -->
  <rect x="29" y="42" width="42" height="6" rx="3" fill="#0a0a0f" opacity="0.3"/>
  <!-- Saucer -->
  <ellipse cx="50" cy="78" rx="35" ry="6" fill="url(#cupGrad)" opacity="0.7"/>
  <ellipse cx="50" cy="78" rx="28" ry="4" fill="var(--bg-color, #0a0a0f)" opacity="0.5"/>
</svg>
