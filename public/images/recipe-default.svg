<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Receita">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b2118"/>
      <stop offset="55%" stop-color="#4a3428"/>
      <stop offset="100%" stop-color="#1a140f"/>
    </linearGradient>
    <linearGradient id="steam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- Cup -->
  <path d="M230 190 h180 a14 14 0 0 1 14 14 v50 a90 90 0 0 1 -90 90 h-28 a90 90 0 0 1 -90 -90 v-50 a14 14 0 0 1 14 -14 z" fill="#8b5a2b"/>
  <ellipse cx="320" cy="190" rx="90" ry="18" fill="#a06a35"/>
  <ellipse cx="320" cy="190" rx="62" ry="12" fill="#6b4120"/>
  <!-- Handle -->
  <path d="M410 220 h26 a34 34 0 0 1 0 68 h-24" fill="none" stroke="#8b5a2b" stroke-width="14" stroke-linecap="round"/>
  <!-- Saucer -->
  <ellipse cx="320" cy="344" rx="140" ry="14" fill="#5a3d26"/>
  <!-- Steam -->
  <path d="M280 130 C270 110 290 96 280 76 M320 124 C310 104 330 90 320 70 M360 130 C350 110 370 96 360 76" fill="none" stroke="url(#steam)" stroke-width="7" stroke-linecap="round">
    <animate attributeName="d" dur="3s" repeatCount="indefinite" values="
      M280 130 C270 110 290 96 280 76 M320 124 C310 104 330 90 320 70 M360 130 C350 110 370 96 360 76;
      M280 130 C272 108 288 92 282 70 M320 124 C312 102 328 86 322 64 M360 130 C352 108 368 92 362 70;
      M280 130 C270 110 290 96 280 76 M320 124 C310 104 330 90 320 70 M360 130 C350 110 370 96 360 76"/>
  </path>
  <!-- Beans -->
  <ellipse cx="150" cy="150" rx="14" ry="20" fill="#5a3d26" transform="rotate(20 150 150)"/>
  <ellipse cx="120" cy="210" rx="14" ry="20" fill="#6b4120" transform="rotate(-15 120 210)"/>
  <ellipse cx="500" cy="130" rx="14" ry="20" fill="#5a3d26" transform="rotate(-25 500 130)"/>
  <ellipse cx="520" cy="230" rx="14" ry="20" fill="#6b4120" transform="rotate(15 520 230)"/>
</svg>
